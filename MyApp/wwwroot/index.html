<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhoKnows - Dynamic Underwriting</title>
    <style>
        body { margin:0; background:#f8fafc; color:#0f172a; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
        .app { max-width:1100px; margin:0 auto; padding:24px; }
        h1, h2 { margin:0 0 12px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
        .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:16px; box-shadow:0 1px 2px rgba(15,23,42,.06); }
        label { display:block; font-size:.9rem; font-weight:600; margin:10px 0 6px; }
        input, select, textarea, button { width:100%; box-sizing:border-box; border-radius:8px; border:1px solid #cbd5e1; font-size:.95rem; padding:8px 10px; }
        textarea { min-height:84px; }
        button { margin-top:10px; background:#2563eb; border-color:#2563eb; color:#fff; font-weight:600; cursor:pointer; }
        button:hover { background:#1d4ed8; }
        ul { margin:8px 0 0; padding-left:18px; }
        pre { margin:8px 0 0; background:#0f172a; color:#e2e8f0; border-radius:8px; padding:10px; font-size:.8rem; overflow:auto; }
        .note { color:#475569; font-size:.88rem; margin-top:8px; }
    </style>
</head>
<body>
<div id="root" class="app">Loading underwriting client...</div>
<script src="/app.bundle.js"></script>
</body>
</html>
